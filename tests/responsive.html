<!doctype html><meta charset="utf-8"><title>GTstudy QA</title><style>body{font:14px system-ui;margin:0}iframe{height:800px;border:1px solid #999}.frame{display:inline-block;vertical-align:top}pre{white-space:pre-wrap}</style><pre id="report">Waiting for study data…</pre><div class="frame"><b>320px</b><br><iframe width="320" src="../dist/"></iframe></div><div class="frame"><b>375px</b><br><iframe width="375" src="../dist/"></iframe></div><div class="frame"><b>768px</b><br><iframe width="768" src="../dist/"></iframe></div><div class="frame"><b>1280px</b><br><iframe width="1280" src="../dist/"></iframe></div><script>
let timer=setInterval(()=>{let frames=[...document.querySelectorAll('iframe')];if(frames.some(f=>f.contentDocument.querySelectorAll('.question').length!==129||!f.contentDocument.querySelector('#liveMap')))return;clearInterval(timer);let out=frames.map(f=>{let d=f.contentDocument,w=f.contentWindow;d.querySelectorAll('.library details').forEach(e=>e.open=true);let over=[...d.querySelectorAll('main *')].filter(e=>{let r=e.getBoundingClientRect();return r.width>0&&(r.right>w.innerWidth+1||r.left<-1)&&!e.closest('.table-wrap')}).map(e=>e.tagName+'.'+e.className).slice(0,8);let nb=d.querySelector('#notebook'),rc=d.querySelector('#readerControls');nb.hidden=false;rc.hidden=false;let panels=[nb,rc].map(e=>{let r=e.getBoundingClientRect();return {id:e.id,left:r.left,right:r.right,bounded:r.left>=0&&r.right<=d.documentElement.clientWidth+1}});nb.hidden=true;rc.hidden=true;let result={panels,width:w.innerWidth,scroll:d.documentElement.scrollWidth,questions:d.querySelectorAll('.question').length,pins:d.querySelectorAll('.geo-pin').length,notesReady:d.querySelectorAll('[data-note-key]').length,overflow:over};d.querySelectorAll('.library details').forEach(e=>e.open=false);return result});document.querySelector('#report').textContent=JSON.stringify(out,null,2)},200);
</script>
